<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Credex | Evaluación crediticia en segundos</title>

    <meta name="description" content="Evalúe personas y empresas con información financiera real en segundos. Automatice decisiones de crédito, aumente la aprobación y reduzca el riesgo con Credex." />

    <meta name="keywords" content="evaluación crediticia, scoring, riesgo, fintech, crédito empresas, Chile" />

    <meta name="author" content="Andrés Barouh" />

    <!-- Open Graph -->
    <meta property="og:title" content="Credex | Evaluación crediticia en segundos" />
    <meta property="og:description" content="Evalúe personas y empresas con información financiera en segundos. Automatice decisiones de crédito, aumente la aprobación y reduzca el riesgo con Credex." />
    <meta property="og:image" content="https://www.credex.cl/preview.png" />
    <meta property="og:url" content="https://www.credex.cl/" />
    <meta property="og:type" content="article" />

    <!-- Autor y fecha -->
    <meta property="article:author" content="Andrés Barouh" />
    <meta property="article:published_time" content="2026-03-22" />
    <meta property="article:modified_time" content="2026-03-22" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Credex | Evaluación crediticia en segundos" />
    <meta name="twitter:description" content="Evalúe personas y empresas con información financiera en segundos. Automatice decisiones de crédito con Credex." />
    <meta name="twitter:image" content="https://www.credex.cl/preview.png" />

    <style id="credex-geo-gate-style">
      html[data-credex-geo-pending="true"] body {
        visibility: hidden;
      }
    </style>

    <script>
      (() => {
        const host = window.location.hostname.toLowerCase();
        const isChileSite =
          host === "credex.cl" ||
          host === "www.credex.cl" ||
          host === "ww2.credex.cl";

        if (!isChileSite) return;

        document.documentElement.dataset.credexGeoPending = "true";

        const redirectToGlobal = () => {
          window.location.replace("https://www.credexapp.com/?market=GLOBAL");
        };

        fetch("/api/geo", {
          cache: "no-store",
          credentials: "same-origin",
          headers: { Accept: "application/json" },
        })
          .then((response) => {
            if (!response.ok) throw new Error("geo_lookup_failed");
            return response.json();
          })
          .then(({ country }) => {
            if (country !== "CL") {
              redirectToGlobal();
              return;
            }

            delete document.documentElement.dataset.credexGeoPending;
          })
          .catch(redirectToGlobal);
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
