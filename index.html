<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO
      title, description, canonical, hreflang y og/twitter los emite
      scripts/generate-seo.mjs por (host, ruta), desde src/config/seo.js.
      No agregar ninguna de esas etiquetas aca: sin data-rh, Helmet no las
      reemplaza y el DOM termina con dos valores distintos de la misma etiqueta.
    -->
    <title>Credex | Evaluación crediticia en segundos</title>

    <meta name="keywords" content="evaluación crediticia, scoring, riesgo, fintech, crédito empresas, Chile" />

    <meta name="author" content="Andrés Barouh" />

    <!-- Open Graph -->
    <meta property="og:type" content="article" />

    <!-- Autor y fecha -->
    <meta property="article:author" content="Andrés Barouh" />
    <meta property="article:published_time" content="2026-03-22" />
    <meta property="article:modified_time" content="2026-03-22" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      D14, Opcion A (Mario, 2026-08-29): aca vivian un <style> que ocultaba el body
      con visibility:hidden y un script que redirigia por IP.

      El mapa de destinos solo tenia CL, PE, CO y AR: toda IP fuera de esos cuatro
      caia en credexapp.com. Googlebot rastrea desde EE.UU., asi que cada rastreo de
      credex.cl terminaba en credexapp.com y el dominio chileno le cedia su autoridad
      al internacional. Search Console lo reportaba como "Pagina con redireccion".

      Ya no se redirige a nadie por su IP en ninguno de los dos dominios. El aviso
      geografico vive ahora en src/components/GeoNotice.jsx: es un enlace, no un
      redirect, y si /api/geo falla o demora no aparece nada.
    -->

    <!-- Google tag (gtag.js) — GA4 www.credex.cl -->
    <!--
      Reemplaza la inyeccion de gtag.js que hace el launcher de Clientify SIN
      measurement ID (por eso GA4 no recibia hits). Al desplegar esto, el campo
      de Google Analytics en la configuracion del chatbot de Clientify DEBE
      quedar VACIO: con los dos, GA4 cuenta cada visita dos veces.

      SPA: las navegaciones internas dependen del enhanced measurement de GA4,
      que esta activado. VERIFICAR tras el deploy que /evaluacion-crediticia y
      /blog aparecen en GA4 antes de agregar un page_view manual por useLocation:
      si el enhanced measurement ya las captura, se duplican.

      Pixel de Meta: pendiente de ID real y de publicar politica de privacidad.
      No instalar antes de tener ambas cosas.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-18BH33XVSP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-18BH33XVSP');
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
