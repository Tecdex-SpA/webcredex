<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página no encontrada | Credex</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <style>
      :root { --dark:#1C2541; --primary:#EC6C20; --light:#F6F8FB; }
      * { box-sizing:border-box; }
      body {
        margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
        background:var(--light); color:var(--dark);
        font-family:"Comfortaa",system-ui,-apple-system,"Segoe UI",sans-serif;
        padding:2rem; text-align:center;
      }
      main { max-width:32rem; }
      img { height:4rem; margin-bottom:2.5rem; }
      .code { font-size:.875rem; letter-spacing:.18em; text-transform:uppercase; color:var(--primary); margin:0 0 1rem; }
      h1 { font-size:1.75rem; line-height:1.3; margin:0 0 1rem; font-weight:700; }
      p { color:#5b6478; line-height:1.6; margin:0 0 2.5rem; }
      a.cta {
        display:inline-block; background:var(--primary); color:#fff; text-decoration:none;
        padding:.85rem 2rem; border-radius:.5rem; font-weight:700;
      }
      a.cta:hover { background:#c85c1b; }
      nav { margin-top:2.5rem; font-size:.875rem; }
      nav a { color:#5b6478; text-decoration:none; margin:0 .75rem; }
      nav a:hover { color:var(--primary); }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-credex.png" alt="Credex" />
      <p class="code">Error 404</p>
      <h1>Esta página no existe</h1>
      <p>Es posible que la dirección haya cambiado o que el enlace esté desactualizado.</p>
      <a class="cta" href="/">Ir al inicio</a>
      <nav>
        <a href="/evaluacion-crediticia">Evaluación crediticia</a>
        <a href="/scoring-crediticio">Scoring crediticio</a>
        <a href="/analisis-riesgo">Análisis de riesgo</a>
        <a href="/blog">Blog</a>
      </nav>
    </main>
  </body>
</html>
